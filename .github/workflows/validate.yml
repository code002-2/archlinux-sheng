name: Validate

# 本地（Windows）无法执行 bash/tar/python，因此把静态检查放到 CI：
#   * 所有 shell 脚本与 PKGBUILD 的 bash 语法检查（bash -n）—— PKGBUILD 本身就是 bash 脚本
#   * shellcheck（warning 级）
#   * workflow YAML 可解析性
#   * Arch 包目录结构检查（每个包必须有 PKGBUILD，payload 型必须有 payload/）
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Static Checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml

      - name: Bash syntax check (scripts)
        run: |
          fail=0
          mapfile -t files < <(git ls-files '*.sh')
          echo "检查 ${#files[@]} 个 shell 脚本"
          for f in "${files[@]}"; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash 语法错误"
              fail=1
            fi
          done
          exit $fail

      - name: Bash syntax check (PKGBUILDs)
        run: |
          fail=0
          mapfile -t pkgs < <(git ls-files 'packages/**/PKGBUILD')
          echo "检查 ${#pkgs[@]} 个 PKGBUILD"
          for f in "${pkgs[@]}"; do
            if ! bash -n "$f"; then
              echo "::error file=$f::PKGBUILD 语法错误"
              fail=1
            fi
          done
          exit $fail

      - name: PKGBUILD metadata check
        run: |
          fail=0
          for f in $(git ls-files 'packages/**/PKGBUILD'); do
            for field in pkgname pkgver pkgrel pkgdesc arch; do
              if ! grep -qE "^${field}=" "$f"; then
                echo "::error file=$f::缺少 ${field}="
                fail=1
              fi
            done
            if ! grep -qE "^arch=\('aarch64'\)" "$f"; then
              echo "::error file=$f::arch 必须是 ('aarch64')"
              fail=1
            fi
          done
          exit $fail

      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'packages/**/PKGBUILD')
          shellcheck --severity=warning --exclude=SC1090,SC1091 "${files[@]}" || {
            echo "::warning::shellcheck 报告了问题（不阻断构建，请人工确认）"
          }

      - name: YAML parse check
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  with open(f, encoding='utf-8') as fh:
                      data = yaml.safe_load(fh)
                  assert isinstance(data, dict), 'top level 不是映射'
                  print(f'  [ OK ] {f}')
              except Exception as e:
                  print(f'  [FAIL] {f}: {e}')
                  bad = 1
          sys.exit(bad)
          PY

      - name: Device package trees
        run: |
          fail=0
          for d in alsa-xiaomi-sheng sheng-sensors sheng-devauth firmware-xiaomi-sheng; do
            if [ -d "packages/$d/payload" ]; then
              echo "  [ OK ] packages/$d/payload"
            elif [ -f "packages/$d/PKGBUILD" ]; then
              echo "  [ OK ] packages/$d/PKGBUILD（源码或 deb 型）"
            else
              echo "::error::packages/$d 既无 payload 也无 PKGBUILD"
              fail=1
            fi
          done
          test -f packages/_shared/deb2pkg.sh || { echo "::error::缺少 packages/_shared/deb2pkg.sh"; exit 1; }
          # 两种底包各自的包列表与 holo 底包实现
          for f in scripts/lists/base.list scripts/lists/kde.list scripts/lists-holo/base.list scripts/lists-holo/kde.list; do
            test -s "$f" || { echo "::error::包列表缺失或为空: $f"; exit 1; }
          done
          test -f scripts/host/01b-bootstrap-holo.sh || { echo "::error::缺少 holo 底包引导脚本"; exit 1; }
          test -f scripts/host/holo-lib.sh || { echo "::error::缺少 holo-lib.sh"; exit 1; }
          test -f packages/sddm/PKGBUILD || { echo "::error::缺少 sddm PKGBUILD（holo 模式的显示管理器）"; exit 1; }
          test -d packages/linux-xiaomi-sheng/prebuilt || { echo "::error::缺少 prebuilt 内核 PKGBUILD"; exit 1; }
          test -d packages/linux-xiaomi-sheng/custom || { echo "::error::缺少 custom 内核 PKGBUILD"; exit 1; }
          test -f patches/wait_for_qmi_service.patch || { echo "::error::缺少 libssc 补丁"; exit 1; }
          test -f patches/adsprpcd-sensorspd.service || { echo "::error::缺少 adsprpcd unit"; exit 1; }
          test -f mkbootimg || { echo "::error::缺少 mkbootimg"; exit 1; }
          test -f sm8550.config || { echo "::error::缺少 sm8550.config"; exit 1; }
          echo "Arch 包目录树检查通过"
          exit $fail
